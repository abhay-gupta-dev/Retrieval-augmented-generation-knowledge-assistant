databases:
  - name: cognitive-rag-db
    databaseName: knowledge_platform
    user: cognitive_rag
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: cognitive-rag-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cognitive-rag-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://cognitive-rag-web.onrender.com"]'
      - key: FRONTEND_URL
        value: https://cognitive-rag-web.onrender.com
      - key: GOOGLE_REDIRECT_URI
        value: https://cognitive-rag-api.onrender.com/api/v1/auth/google/callback
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: openai/gpt-oss-20b

  - type: web
    name: cognitive-rag-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: starter
    envVars:
      - key: VITE_API_URL
        value: https://cognitive-rag-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
